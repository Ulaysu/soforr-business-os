name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Soforr.BusinessOS.slnx

      - name: Build
        run: dotnet build Soforr.BusinessOS.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Soforr.BusinessOS.slnx --no-build --configuration Release --verbosity normal
