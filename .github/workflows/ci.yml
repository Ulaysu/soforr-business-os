name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CI: true
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Soforr.BusinessOS.slnx

      - name: Verify formatting
        run: dotnet format Soforr.BusinessOS.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Soforr.BusinessOS.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Soforr.BusinessOS.slnx --no-build --configuration Release --verbosity normal
