name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CI: true
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Soforr.BusinessOS.slnx

      - name: Verify formatting
        run: dotnet format Soforr.BusinessOS.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Soforr.BusinessOS.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Soforr.BusinessOS.slnx --no-build --configuration Release --verbosity normal

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/Soforr.Web
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Soforr.Web/package-lock.json

      - name: Install
        run: npm ci

      # The client's types must be exactly what the committed OpenAPI snapshot generates. Regenerate them and fail on any
      # difference; the .NET job separately proves the snapshot matches the API itself (OpenApiSnapshotTests).
      # Known-vulnerable packages: fails on high and critical findings (including indirect dependencies).
      - name: Audit npm packages
        run: npm audit --audit-level=high

      - name: Regenerate API types and verify no changes
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts

      - name: Restore generated files
        if: always()
        run: git checkout -- src/api/schema.d.ts

      - name: Lint
        run: npm run lint

      - name: Verify formatting
        run: npm run format:check

      - name: Build (type-check and bundle)
        run: npm run build

      - name: Test
        run: npm test

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scans the whole history for committed secrets with gitleaks (default rules plus .gitleaks.toml). Pinned image tag.
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  # Builds the images and starts the local container system (DEPLOY-001): PostgreSQL, the migrations, and the API, then checks it.
  containers:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Prepare local configuration
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "DEV_CERT_PASSWORD=$(openssl rand -hex 16)"
          } > .env
          set -a; . ./.env; set +a
          mkdir -p .local/certs
          dotnet dev-certs https -ep .local/certs/aspnetapp.pfx -p "$DEV_CERT_PASSWORD"
          chmod 644 .local/certs/aspnetapp.pfx

      # Plain `docker compose up` must keep working for someone who only has POSTGRES_PASSWORD: the app-only variables are optional there.
      - name: Plain compose needs only the database password
        run: |
          test "$(env -u DEV_CERT_PASSWORD POSTGRES_PASSWORD=x docker compose --env-file /dev/null config --services)" = "postgres"

      - name: Build and start
        run: docker compose --profile app up --build -d

      - name: Wait until the API is ready
        run: |
          for attempt in $(seq 1 60); do
            if curl -ksf https://localhost:7443/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "The API did not become ready." >&2
          docker compose --profile app ps
          docker compose --profile app logs
          exit 1

      - name: Check the running system
        run: |
          set -e
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost:7443/health/live)" = 200
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost:7443/health/ready)" = 200
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost:7443/openapi/v1.json)" = 200
          # Default deny: an unauthenticated call is refused, not served.
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost:7443/api/v1/products)" = 401
          # The antiforgery token works over HTTPS (the cookies are Secure).
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost:7443/api/v1/auth/antiforgery)" = 200
          # The migrations were applied to the container database.
          set -a; . ./.env; set +a
          tables=$(docker compose exec -T postgres psql -U soforr -d soforr -tAc "select count(*) from information_schema.tables where table_schema = 'public' and table_name in ('Sales', 'OfflineGrants', 'Organizations')")
          test "$tables" = 3

      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs

      - name: Tear down
        if: always()
        run: docker compose --profile app down -v
